name: Publish PixiePop APK

on:
  push:
    tags:
      - pixiepop-v1.3.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo '54861a7d720d70ae05c6290dde3fde122bf27f866ee0a5bd8e1f587330005701  downloads/PixiePop-Android-V1.3.0-debug.apk' | sha256sum -c -
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            downloads/PixiePop-Android-V1.3.0-debug.apk \
            --title "PixiePop Android 1.3.0" \
            --notes "PixiePop 1.3.0 debug APK. New app name and icon, configurable double/triple tap actions, selected app launch, flashlight, MediaProjection screenshot/recording, and seven selectable characters. SHA-256: 54861a7d720d70ae05c6290dde3fde122bf27f866ee0a5bd8e1f587330005701"
