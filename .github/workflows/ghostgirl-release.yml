name: Publish GhostGirl APK

on:
  push:
    tags:
      - ghostgirl-v1.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo 'e91e33f8bd4b6deef0e0961fcc33c92b93d4e64ed9360810e2fd42326091e7bf  downloads/GhostGirl-Android-V1.1.0-debug.apk' | sha256sum -c -
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            downloads/GhostGirl-Android-V1.1.0-debug.apk \
            --title "GhostGirl Android 1.1.0" \
            --notes "GhostGirl 1.1.0 debug APK. Adds double/triple tap and five selectable reference-derived characters. SHA-256: e91e33f8bd4b6deef0e0961fcc33c92b93d4e64ed9360810e2fd42326091e7bf"
