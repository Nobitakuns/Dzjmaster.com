name: Publish PixiePop APK

on:
  push:
    tags:
      - pixiepop-v1.4.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo '4b8e701af56bdcd00d93f4d189a52488146830ce83645bb65ac06758afbb600b  downloads/PixiePop-Android-V1.4.0-debug.apk' | sha256sum -c -
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            downloads/PixiePop-Android-V1.4.0-debug.apk \
            --title "PixiePop Android 1.4.0" \
            --notes "PixiePop 1.4.0 debug APK. Instant full-display screenshot via a user-enabled accessibility screenshot service, without the app/screen picker; recording still uses Android MediaProjection consent. SHA-256: 4b8e701af56bdcd00d93f4d189a52488146830ce83645bb65ac06758afbb600b"
