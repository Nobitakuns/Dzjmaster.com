name: Publish PixiePop macOS

on:
  push:
    branches:
      - new-project
    tags:
      - 'pixiepop-mac-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: swift --version
      - name: Test version comparison
        run: swift test --package-path macos/PixiePop
      - name: Build arm64 app and DMG
        run: bash macos/PixiePop/scripts/package.sh
      - name: Publish installable DMG
        if: startsWith(github.ref, 'refs/tags/pixiepop-mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/PixiePop-macOS-arm64-0.1.0.dmg \
            dist/PixiePop-macOS-arm64-0.1.0.dmg.sha256 \
            --title "PixiePop macOS 0.1.0 (Apple Silicon)" \
            --notes "Native macOS floating companion for Apple Silicon. Open the DMG and drag PixiePop into Applications. The app checks GitHub Releases for future Mac versions and opens the new DMG when available. This build is ad-hoc signed and is not Apple notarized; macOS may require Open Anyway in Privacy & Security on first launch."
